name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: msvc
          - os: ubuntu-24.04
            preset: gcc
          - os: ubuntu-24.04
            preset: clang
          - os: ubuntu-24.04
            preset: gcc-asan
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: clang-format --dry-run --Werror include/courier/*.hpp src/*.hpp src/*.cpp tests/*.cpp
